<title>Breket Center</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ------------------------------------------------------------------ тема */
:root {
  --brand: #4ED8D9;
  --brand-ink: #04393A;
  --brand-deep: #0E8F92;
  --brand-soft: rgba(78, 216, 217, .14);
  --bg: #F3F7F7;
  --card: #FFFFFF;
  --text: #0F1F20;
  --muted: #687A7B;
  --line: rgba(15, 31, 32, .08);
  --danger: #E5484D;
  --ok: #2F9E5B;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(15,31,32,.04), 0 6px 20px rgba(15,31,32,.05);
  --safe-bottom: max(env(safe-area-inset-bottom), 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1617; --card: #172122; --text: #EAF2F2; --muted: #8FA2A3;
    --line: rgba(234,242,242,.09); --brand-deep: #4ED8D9; --brand-soft: rgba(78,216,217,.13);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1617; --card: #172122; --text: #EAF2F2; --muted: #8FA2A3;
  --line: rgba(234,242,242,.09); --brand-deep: #4ED8D9; --brand-soft: rgba(78,216,217,.13);
  --shadow: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.45; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px calc(110px + var(--safe-bottom)); }

/* ------------------------------------------------------------------ шапка */
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 6px; }
.back { width: 38px; height: 38px; border-radius: 12px; display: none; place-items: center; background: var(--card); box-shadow: var(--shadow); }
.back svg { width: 20px; height: 20px; }
.no-tg .back.show { display: grid; }
.top-title { font-weight: 700; font-size: 16px; flex: 1; }
.lang { display: flex; background: var(--card); border-radius: 12px; padding: 3px; box-shadow: var(--shadow); }
.lang button { padding: 6px 10px; border-radius: 9px; font-weight: 700; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.lang button.on { background: var(--brand); color: var(--brand-ink); }

.logo { width: 40px; height: 46px; background: var(--brand); -webkit-mask: url(logo.png) center/contain no-repeat; mask: url(logo.png) center/contain no-repeat; flex: none; }

.hero { display: flex; align-items: center; gap: 14px; padding: 18px 18px 18px 16px; margin: 4px 0 14px;
  background: linear-gradient(135deg, var(--brand-soft), transparent 70%), var(--card);
  border-radius: 22px; box-shadow: var(--shadow); }
.hero .logo { width: 54px; height: 62px; }
.hero h1 { font-size: 21px; line-height: 1.15; margin: 0; font-weight: 800; letter-spacing: -.01em; }
.hero p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; font-weight: 600; }

/* ------------------------------------------------------------------ блоки */
h2 { font-size: 22px; font-weight: 800; letter-spacing: -.015em; margin: 6px 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; font-weight: 500; }
.label { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); margin: 22px 4px 8px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack > * + * { margin-top: 10px; }

.cta { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 18px; border-radius: 20px;
  background: var(--brand); color: var(--brand-ink); box-shadow: 0 10px 24px rgba(78,216,217,.32); transition: transform .12s; }
.cta:active { transform: scale(.985); }
.cta .ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.45); display: grid; place-items: center; flex: none; }
.cta .ic svg { width: 24px; height: 24px; }
.cta b { display: block; font-size: 17px; font-weight: 800; }
.cta span { font-size: 13px; font-weight: 600; opacity: .75; }
.cta .arrow { margin-left: auto; width: 20px; height: 20px; opacity: .6; }

.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; }
.row + .row { border-top: 1px solid var(--line); }
.row .ri { width: 38px; height: 38px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-deep); display: grid; place-items: center; flex: none; }
.row .ri svg { width: 20px; height: 20px; }
.row b { display: block; font-weight: 700; }
.row small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.row .chev { margin-left: auto; width: 18px; height: 18px; color: var(--muted); flex: none; }
.list { padding: 0; overflow: hidden; }

/* запись */
.bk-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand-deep); }
.badge.ok { background: rgba(47,158,91,.12); color: var(--ok); }
.bk-date { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.bk-time { font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.bk-time b { color: var(--text); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 14px; border-radius: 14px; font-weight: 700; font-size: 14.5px; background: var(--brand-soft); color: var(--brand-deep); transition: transform .12s, opacity .12s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.danger { background: rgba(229,72,77,.1); color: var(--danger); }
.btn.full { grid-column: 1 / -1; width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; font-weight: 500; }

/* шаги */
.steps { display: flex; gap: 6px; margin: 2px 0 16px; }
.steps i { height: 4px; flex: 1; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--brand); }

.branch { display: block; width: 100%; text-align: left; padding: 16px; border: 2px solid transparent; }
.branch.sel { border-color: var(--brand); }
.branch .bn { display: flex; align-items: center; justify-content: space-between; }
.branch b { font-size: 18px; font-weight: 800; }
.days { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
.days span { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-deep); }
.branch small { display: block; color: var(--muted); margin-top: 8px; font-size: 13px; font-weight: 500; }
.branch .near { color: var(--text); font-weight: 700; }

.grid { display: grid; gap: 8px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.chip { background: var(--card); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 6px; text-align: center; border: 2px solid transparent; transition: transform .1s; }
.chip:active { transform: scale(.96); }
.chip.sel { border-color: var(--brand); background: var(--brand-soft); }
.chip .w { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chip .d { font-size: 22px; font-weight: 800; line-height: 1.15; }
.chip .m { font-size: 12px; font-weight: 600; color: var(--muted); }
.chip .t { font-size: 17px; font-weight: 800; }
.month { font-weight: 800; font-size: 14px; margin: 16px 2px 8px; text-transform: capitalize; }
.month:first-child { margin-top: 0; }

.sum .line { display: flex; gap: 12px; padding: 11px 0; align-items: flex-start; }
.sum .line + .line { border-top: 1px solid var(--line); }
.sum .k { color: var(--muted); font-size: 13.5px; font-weight: 600; width: 92px; flex: none; }
.sum .v { font-weight: 700; }
.sum .v small { display: block; font-weight: 500; color: var(--muted); }

.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 4px 6px; }
.input { width: 100%; font: inherit; font-weight: 600; font-size: 16px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); outline: none; }
.input:focus { border-color: var(--brand); }
.phone-in { display: flex; align-items: center; border: 2px solid var(--line); border-radius: 14px; background: var(--card); }
.phone-in:focus-within { border-color: var(--brand); }
.phone-in span { padding: 0 2px 0 16px; font-weight: 700; font-size: 16px; color: var(--muted); }
.phone-in .input { border: 0; padding-left: 8px; background: none; }
.or { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: var(--muted); font-size: 13px; font-weight: 700; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--brand-deep); font-weight: 700; font-size: 14px; }
.phone-ok { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--brand-soft); font-weight: 700; }

.done { text-align: center; padding: 24px 8px 8px; }
.done .tick { width: 78px; height: 78px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; margin: 0 auto 16px; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.done .tick svg { width: 38px; height: 38px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

/* нижняя кнопка */
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + var(--safe-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 5; }
.bar .btn { max-width: 488px; margin: 0 auto; min-height: 54px; font-size: 16px; border-radius: 16px; box-shadow: 0 10px 24px rgba(78,216,217,.3); }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); font-weight: 600; }
.loader { display: grid; place-items: center; min-height: 60vh; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--brand-soft); border-top-color: var(--brand); animation: s .8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 16px; right: 16px; top: 14px; max-width: 488px; margin: 0 auto; z-index: 10; background: var(--text); color: var(--bg); padding: 13px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; transform: translateY(-140%); transition: transform .3s; }
.toast.show { transform: none; }
.demo { font-size: 12px; font-weight: 700; text-align: center; color: var(--brand-deep); background: var(--brand-soft); padding: 7px; border-radius: 10px; margin-bottom: 10px; }
.fade { animation: f .25s ease; }
@keyframes f { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>

/* ------------------------------------------------------------------ тексты */

const branchName = b => S.lang === 'uz' ? `${b} ${t('filial')}` : b;
const DEFAULT_DAYS = { Sergeli: [1, 3, 5], Yashnabod: [2, 4, 6] };
const branchDays = b => (branchInfo(b).days || DEFAULT_DAYS[b] || []);

function haptic(kind) {
  try {
    if (!inTg) return;
    if (kind === 'sel') tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.notificationOccurred(kind);
  } catch (e) {}
}
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 3200);
}
function confirmDialog(msg) {
  return new Promise(res => {
    if (inTg && tg.isVersionAtLeast('6.2')) tg.showConfirm(msg, ok => res(ok));
    else res(window.confirm(msg));
  });
}

/* ------------------------------------------------------------------ API */
async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  if (!API_URL) throw new Error('not_configured');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, initData: tg.initData, ...data }) });
  const txt = await r.text();
  let j;
  try { j = JSON.parse(txt); } catch (e) { const er = new Error('bad_response'); er.detail = txt.slice(0, 120); throw er; }
  if (!j.ok) { const er = new Error(j.error || 'error'); er.detail = j.detail; throw er; }
  return j;
}
function errText(e) {
  const m = { slot_taken: 'slotTaken', too_late: 'tooLate', changed_by_admin: 'changed', limit: 'limit' }[e.message];
  if (m) return t(m);
  const d = e.detail || e.message;
  return t('error') + (d && d !== 'error' ? ` [${d}]` : '');
}

/* ------------------------------------------------------------------ демо-данные (вне Telegram) */
const demo = { user: null, bookings: [], slots: null };
function demoSlots() {
  const out = { Sergeli: {}, Yashnabod: {} };
  const times = ['11:00', '11:30', '12:00', '12:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30'];
  const now = new Date();
  for (let i = 1; i < 25; i++) {
    const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate() + i, 12));
    const wd = d.getUTCDay(), key = d.toISOString().slice(0, 10);
    const br = Object.keys(DEFAULT_DAYS).find(b => DEFAULT_DAYS[b].includes(wd));
    if (!br) continue;
    const free = times.filter((_, j) => (j * 7 + i * 3) % 5 > 1);
    if (i === 3) continue; // день без мест
    out[br][key] = free;
  }
  return out;
}
async function demoApi(action, d) {
  await new Promise(r => setTimeout(r, 350));
  demo.slots = demo.slots || demoSlots();
  const today = new Date().toISOString().slice(0, 10);
  const pub = b => ({ ...b, canChange: today < b.day });
  if (action === 'init') return {
    user: demo.user, bookings: demo.bookings.filter(b => b.status === 'active').map(pub), slots: demo.slots, today,
    config: { branchOrder: ['Sergeli', 'Yashnabod'], adminUsername: '', branches: {
      Sergeli: { days: [1, 3, 5], address_uz: "Sergeli tumani (demo manzil)", address_ru: 'Сергелийский район (демо-адрес)', landmark_uz: '', landmark_ru: '', map: '' },
      Yashnabod: { days: [2, 4, 6], address_uz: "Yashnobod tumani (demo manzil)", address_ru: 'Яшнабадский район (демо-адрес)', landmark_uz: '', landmark_ru: '', map: '' } } }
  };
  if (action === 'register') { demo.user = { name: d.name, phone: d.phone.replace(/\D/g, '').slice(-9), lang: d.lang }; return { user: demo.user }; }
  if (action === 'setLang') return {};
  if (action === 'book') {
    const list = demo.slots[d.branch][d.day] || [];
    if (!list.includes(d.time)) throw new Error('slot_taken');
    demo.slots[d.branch][d.day] = list.filter(x => x !== d.time);
    if (d.moveFrom) { const o = demo.bookings.find(b => b.id === d.moveFrom); o.status = 'moved'; (demo.slots[o.branch][o.day] = demo.slots[o.branch][o.day] || []).push(o.time); demo.slots[o.branch][o.day].sort(); }
    const b = { id: 'd' + Date.now(), day: d.day, time: d.time, branch: d.branch, confirmed: false, status: 'active' };
    demo.bookings.push(b);
    return { booking: pub(b), slots: demo.slots };
  }
  if (action === 'cancel') { const b = demo.bookings.find(x => x.id === d.id); b.status = 'cancelled'; (demo.slots[b.branch][b.day] = demo.slots[b.branch][b.day] || []).push(b.time); demo.slots[b.branch][b.day].sort(); return { slots: demo.slots }; }
  if (action === 'confirm') { demo.bookings.find(x => x.id === d.id).confirmed = true; return {}; }
  return {};
}

/* ------------------------------------------------------------------ навигация */
const PARENT = { branch: 'home', date: 'branch', time: 'date', register: 'time', confirm: 'time', done: 'home' };
function go(screen) {
  S.screen = screen;
  render();
  window.scrollTo(0, 0);
}
function back() {
  haptic('sel');
  let p = PARENT[S.screen] || 'home';
  if (S.screen === 'confirm' && !S.user) p = 'register';
  if (p === 'home') S.moveFrom = null;
  go(p);
}

function setBar(text, onClick, disabled) {
  const bar = $('#bar'), b = $('#barBtn');
  if (!text) { bar.hidden = true; b.onclick = null; return; }
  bar.hidden = false; b.textContent = text; b.disabled = !!disabled || S.busy;
  b.onclick = onClick;
}

/* ------------------------------------------------------------------ экраны */
function render() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang));
  const isHome = S.screen === 'home' || S.screen === 'done';
  $('#back').classList.toggle('show', !isHome);
  if (inTg) { if (isHome) tg.BackButton.hide(); else tg.BackButton.show(); }
  const titles = { branch: t('book'), date: t('book'), time: t('book'), register: t('yourData'), confirm: t('book') };
  $('#topTitle').textContent = isHome ? '' : (S.moveFrom ? t('move') : titles[S.screen] || '');
  setBar(null);
  const html = SCREENS[S.screen]();
  const app = $('#app');
  app.innerHTML = (DEMO ? `<div class="demo">${t('demo')}</div>` : '') + `<div class="fade">${html}</div>`;
  (AFTER[S.screen] || (() => {}))();
}

const AFTER = {
  time() { if (S.time) setBar(t('next'), nextFromTime); },
  register() {
    const upd = () => setBar(t('next'), submitRegistration, ($('#regName').value.trim().length < 2) || !(S.regPhone || ($('#regPhone') && localPhone($('#regPhone').value))));
    $('#regName').addEventListener('input', e => { S.regName = e.target.value; upd(); });
    if ($('#regPhone')) $('#regPhone').addEventListener('input', e => { S.phoneDraft = e.target.value; upd(); });
    upd();
  },
  confirm() { setBar(S.moveFrom ? t('confirmMove') : t('confirm'), doBook); },
  done() { setBar(null); }
};

/* ------------------------------------------------------------------ действия */
function startBooking() {
  S.branch = S.branch || (S.user && S.user.lastBranch) || null; S.day = null; S.time = null;
  go('branch');
}
function nextFromTime() {
  go(S.user ? 'confirm' : 'register');
}
function submitRegistration() {
  S.regName = $('#regName').value.trim().split(/\s+/).join(' ');
  if ($('#regPhone')) S.regPhone = localPhone($('#regPhone').value);
  go('confirm');
}
// «90 123 45 67», «+998 90 123-45-67», «998901234567» → «901234567»; иначе ''
function localPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.length === 12 && d.startsWith('998')) d = d.slice(3);
  return d.length === 9 ? d : '';
}
function sharePhone() {
  if (DEMO) { S.regPhone = '901234567'; render(); return; }
  tg.requestContact((ok, res) => {
    if (ok && res && res.responseUnsafe && res.responseUnsafe.contact) {
      S.regPhone = res.responseUnsafe.contact.phone_number; haptic('success'); render();
    }
  });
}
function askWriteAccess() {
  return new Promise(res => {
    if (!inTg || !tg.isVersionAtLeast('6.9')) return res();
    try { tg.requestWriteAccess(() => res()); } catch (e) { res(); }
  });
}

async function doBook() {
  if (S.busy) return;
  S.busy = true; setBar(S.moveFrom ? t('confirmMove') : t('confirm'), null, true); $('#barBtn').innerHTML = '<div class="spin" style="width:22px;height:22px;border-width:2.5px"></div>';
  try {
    if (!S.user) {
      const r = await api('register', { name: S.regName, phone: S.regPhone, lang: S.lang });
      S.user = r.user;
    }
    await askWriteAccess();
    const moved = !!S.moveFrom;
    const r = await api('book', { branch: S.branch, day: S.day, time: S.time, moveFrom: S.moveFrom || undefined });
    S.slots = r.slots; S.bookings = [r.booking]; S.moveFrom = null; S.user.lastBranch = S.branch;
    S.result = { ...r.booking, moved };
    haptic('success');
    S.busy = false; go('done');
  } catch (e) {
    // запись могла пройти, а ответ потеряться — проверяем
    if (!['slot_taken', 'too_late', 'limit', 'changed_by_admin', 'need_registration'].includes(e.message)) {
      try {
        const want = { day: S.day, time: S.time, branch: S.branch }, moved = !!S.moveFrom;
        await refresh();
        const b = S.bookings.find(x => x.day === want.day && x.time === want.time && x.branch === want.branch);
        if (b) { S.moveFrom = null; S.result = { ...b, moved }; haptic('success'); S.busy = false; go('done'); return; }
      } catch (_) {}
    }
    S.busy = false; haptic('error'); toast(errText(e));
    if (e.message === 'slot_taken') {
      try { S.slots = (await api('slots')).slots; } catch (_) {}
      S.time = null; go('time');
    } else render();
  }
}

async function refresh() {
  const r = await api('init');
  S.user = r.user; S.config = r.config; S.bookings = r.bookings; S.slots = r.slots; S.today = r.today;
  if (r.user && r.user.lang) S.lang = r.user.lang;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || S.busy) return;
  const a = el.dataset.act;
  if (a === 'book') { haptic('sel'); startBooking(); }
  else if (a === 'home') { S.moveFrom = null; go('home'); }
  else if (a === 'pickBranch') { haptic('sel'); S.branch = el.dataset.branch; S.day = null; S.time = null; go('date'); }
  else if (a === 'pickDate') {
    haptic('sel'); S.day = el.dataset.day; S.time = null;
    if (!((S.slots[S.branch] || {})[S.day] || []).length) { toast(t('noSlotsDay')); return; }
    go('time');
  }
  else if (a === 'pickTime') {
    haptic('sel'); S.time = el.dataset.time;
    document.querySelectorAll('[data-act="pickTime"]').forEach(x => x.classList.toggle('sel', x === el));
    setBar(t('next'), nextFromTime);
  }
  else if (a === 'share') sharePhone();
  else if (a === 'phoneManual') { haptic('sel'); S.phoneMode = 'manual'; render(); const p = $('#regPhone'); p && p.focus(); }
  else if (a === 'phoneShare') { haptic('sel'); S.phoneMode = 'share'; render(); }
  else if (a === 'phoneReset') { haptic('sel'); S.regPhone = ''; S.phoneDraft = ''; S.phoneMode = null; render(); }
  else if (a === 'map') {
    const url = branchInfo(el.dataset.branch).map;
    if (!url) { toast(addr(el.dataset.branch) || '—'); return; }
    inTg ? tg.openLink(url) : window.open(url, '_blank');
  }
  else if (a === 'admin') {
    const u = S.config.adminUsername;
    if (!u) { toast('—'); return; }
    inTg ? tg.openTelegramLink('https://t.me/' + u) : window.open('https://t.me/' + u, '_blank');
  }
  else if (a === 'coming') {
    S.busy = true;
    try { await api('confirm', { id: el.dataset.id }); S.bookings.forEach(b => { if (b.id === el.dataset.id) b.confirmed = true; }); haptic('success'); toast(t('thanks')); }
    catch (err) { toast(errText(err)); }
    S.busy = false; render();
  }
  else if (a === 'move') { S.moveFrom = el.dataset.id; const b = S.bookings.find(x => x.id === S.moveFrom); S.branch = b.branch; S.day = null; S.time = null; go('branch'); }
  else if (a === 'cancel') {
    if (!(await confirmDialog(t('askCancel')))) return;
    S.busy = true; render();
    try { const r = await api('cancel', { id: el.dataset.id }); S.slots = r.slots; S.bookings = S.bookings.filter(b => b.id !== el.dataset.id); haptic('success'); toast(t('cancelled')); }
    catch (err) { haptic('error'); toast(errText(err)); if (err.message === 'changed_by_admin') S.bookings = S.bookings.filter(b => b.id !== el.dataset.id); }
    S.busy = false; render();
  }
});

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  if (S.lang === b.dataset.l) return;
  S.lang = b.dataset.l; haptic('sel'); render();
  if (S.user) api('setLang', { lang: S.lang }).catch(() => {});
}));

(async function start() {
  if (inTg) {
    tg.ready(); tg.expand();

    try { tg.setHeaderColor(tg.colorScheme === 'dark' ? '#0E1617' : '#F3F7F7'); tg.setBackgroundColor(tg.colorScheme === 'dark' ? '#0E1617' : '#F3F7F7'); } catch (e) {}

    S.lang = lc.startsWith('ru') ? 'ru' : 'uz';
  } else {
    S.lang = (navigator.language || '').startsWith('ru') ? 'ru' : 'uz';
  }
  try {
    await refresh();
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="hero"><div class="logo"></div><div><h1>Breket Center</h1><p>${t('doctor')}</p></div></div>
      <div class="card empty">${t('error')}<br><small>${esc(e.message)}</small><br><br><button class="btn primary" onclick="location.reload()">↻</button></div>`;
  }
})();
</script>
</body>
</html>
