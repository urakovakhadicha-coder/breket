<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Breket Center — Admin</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root {
  --brand: #4ED8D9; --brand-ink: #04393A; --brand-deep: #0E8F92; --brand-soft: rgba(78,216,217,.14);
  --bg: #F3F7F7; --card: #FFFFFF; --card2: #F8FBFB; --text: #0F1F20; --muted: #687A7B; --line: rgba(15,31,32,.09);
  --danger: #D93D42; --danger-soft: rgba(229,72,77,.1); --ok: #2B8C52; --ok-soft: rgba(47,158,91,.12);
  --warn: #B7791F; --warn-soft: rgba(214,158,46,.14);
  --shadow: 0 1px 2px rgba(15,31,32,.04), 0 6px 20px rgba(15,31,32,.05);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1617; --card: #172122; --card2: #1C2829; --text: #EAF2F2; --muted: #8FA2A3; --line: rgba(234,242,242,.1);
    --brand-deep: #4ED8D9; --brand-soft: rgba(78,216,217,.13); --shadow: none;
    --danger: #FF6B6F; --ok: #4CC17E; --warn: #E8B04B;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1617; --card: #172122; --card2: #1C2829; --text: #EAF2F2; --muted: #8FA2A3; --line: rgba(234,242,242,.1);
  --brand-deep: #4ED8D9; --brand-soft: rgba(78,216,217,.13); --shadow: none;
  --danger: #FF6B6F; --ok: #4CC17E; --warn: #E8B04B;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--brand-deep); text-decoration: none; }
.logo { background: var(--brand); -webkit-mask: url(../logo.png) center/contain no-repeat; mask: url(../logo.png) center/contain no-repeat; flex: none; }

/* --- вход */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 28px 24px; }
.login-card .logo { width: 52px; height: 60px; margin-bottom: 14px; }
.login-card h1 { margin: 0; font-size: 22px; font-weight: 800; }
.login-card p { margin: 4px 0 22px; color: var(--muted); font-weight: 600; }

/* --- каркас */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); background: var(--card); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand .logo { width: 30px; height: 35px; }
.brand b { display: block; font-weight: 800; font-size: 15px; line-height: 1.2; }
.brand small { color: var(--muted); font-weight: 600; font-size: 12px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 700; color: var(--muted); width: 100%; text-align: left; }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav:hover { background: var(--card2); color: var(--text); }
.nav.on { background: var(--brand-soft); color: var(--brand-deep); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.who { font-weight: 700; font-size: 13px; }
.who small { display: block; color: var(--muted); font-weight: 600; }
.main { padding: 22px 28px 60px; max-width: 1180px; width: 100%; min-width: 0; }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.015em; flex: 1; min-width: 160px; }

.seg { display: inline-flex; background: var(--card2); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 11px; border-radius: 9px; font-weight: 700; font-size: 12.5px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.side .seg { align-self: flex-start; }

/* --- элементы */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 8px 14px; border-radius: 11px; font-weight: 700; font-size: 13.5px; background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--line); white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.ghost { background: none; box-shadow: none; border-color: transparent; }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; border-radius: 9px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.input, select.input, textarea.input { width: 100%; padding: 10px 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--card); outline: none; font-weight: 600; }
.input:focus { border-color: var(--brand); }
label.f { display: block; }
label.f > span { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 0 2px 5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
.pad { padding: 18px; }
.muted { color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--card2); color: var(--muted); white-space: nowrap; }
.badge.bot { background: var(--brand-soft); color: var(--brand-deep); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.no { background: var(--danger-soft); color: var(--danger); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.empty { padding: 28px; text-align: center; color: var(--muted); font-weight: 600; }

/* --- расписание */
.datebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.datebar .input { width: auto; padding: 7px 10px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 14px; scrollbar-width: thin; }
.day { flex: none; width: 66px; padding: 8px 4px; border-radius: 13px; background: var(--card); border: 1.5px solid var(--line); text-align: center; }
.day .w { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.day .d { font-size: 19px; font-weight: 800; line-height: 1.2; }
.day .c { font-size: 11px; font-weight: 700; color: var(--muted); min-height: 15px; }
.day.on { border-color: var(--brand); background: var(--brand-soft); }
.day.today .d { color: var(--brand-deep); }
.day.off { opacity: .5; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; align-items: start; }
.bcard-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bcard-h b { font-size: 17px; font-weight: 800; }
.bcard-h .sp { flex: 1; }
.slot { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.slot:last-child { border-bottom: 0; }
.slot .tm { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.slot .nm { font-weight: 700; }
.slot .ph { font-size: 13px; color: var(--muted); font-weight: 600; }
.slot .meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.slot .note { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.slot .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.slot.free .nm { color: var(--muted); font-weight: 600; }
.slot.blocked { background: repeating-linear-gradient(-45deg, transparent 0 8px, var(--card2) 8px 16px); }
.slot.came { background: linear-gradient(90deg, var(--ok-soft), transparent 40%); }
.slot.noshow { background: linear-gradient(90deg, var(--danger-soft), transparent 40%); }
.slot.offgrid .tm::after { content: '*'; color: var(--warn); }
.ib { width: 32px; height: 32px; border-radius: 9px; display: inline-grid; place-items: center; color: var(--muted); border: 1px solid var(--line); background: var(--card); }
.ib:hover { color: var(--text); border-color: var(--brand); }
.ib svg { width: 16px; height: 16px; }
.ib.ok:hover { color: var(--ok); border-color: var(--ok); }
.ib.no:hover { color: var(--danger); border-color: var(--danger); }
details.cx { border-top: 1px solid var(--line); }
details.cx summary { padding: 10px 16px; cursor: pointer; font-weight: 700; color: var(--muted); font-size: 13px; }
.closed { padding: 26px 16px; text-align: center; color: var(--muted); font-weight: 700; }

/* --- таблицы */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.table td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--card2); }
.scroll-x { overflow-x: auto; }

/* --- статистика */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 16px; }
.kpi small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.kpi b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding: 16px 18px 0; }
.bar { flex: 1; display: flex; flex-direction: column-reverse; min-width: 6px; border-radius: 5px 5px 0 0; overflow: hidden; background: var(--card2); position: relative; }
.bar i { display: block; }
.bar i.c { background: var(--ok); }
.bar i.n { background: var(--danger); }
.bar i.p { background: var(--brand); }
.bar-l { display: flex; gap: 4px; padding: 6px 18px 14px; font-size: 10.5px; color: var(--muted); font-weight: 700; }
.bar-l span { flex: 1; text-align: center; min-width: 6px; overflow: hidden; }
.legend { display: flex; gap: 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 0 18px 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* --- настройки */
.days-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.days-pick label { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; padding: 7px 8px; border-radius: 10px; border: 1.5px solid var(--line); font-weight: 700; font-size: 13px; cursor: pointer; user-select: none; }
.days-pick input { display: none; }
.days-pick label:has(input:checked) { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
h3 { font-size: 16px; font-weight: 800; margin: 0 0 14px; }
.sect + .sect { margin-top: 16px; }

/* --- модальное окно, панель, тост */
.overlay { position: fixed; inset: 0; background: rgba(5,15,16,.45); display: grid; place-items: center; padding: 16px; z-index: 50; animation: fi .15s; }
@keyframes fi { from { opacity: 0; } }
.modal { width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border-radius: 20px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal h2 { margin: 0 0 16px; font-size: 19px; font-weight: 800; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; }
.check input { width: 18px; height: 18px; accent-color: var(--brand-deep); }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--card); z-index: 40; box-shadow: -10px 0 40px rgba(0,0,0,.15); overflow: auto; padding: 22px; animation: sl .2s; }
@keyframes sl { from { transform: translateX(30px); opacity: 0; } }
.toast { visibility: hidden; position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 60; transition: transform .25s; max-width: calc(100% - 32px); }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast.err { background: var(--danger); color: #fff; }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--brand-soft); border-top-color: var(--brand); animation: s .8s linear infinite; margin: 40px auto; }
@keyframes s { to { transform: rotate(360deg); } }

/* --- телефон */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .head h1 { min-width: 0; flex-basis: 100%; }
  .datebar { width: 100%; }
  .datebar .input { flex: 1; min-width: 0; }
  .head .seg { max-width: 100%; overflow-x: auto; }
  .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); z-index: 30; justify-content: space-around; }
  .brand, .side-foot { display: none; }
  .nav { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 6px 4px; width: auto; flex: 1; text-align: center; }
  .main { padding: 16px 14px 100px; }
  .mob-only { display: inline-flex !important; }
  .cols { grid-template-columns: 1fr; }
  .slot { grid-template-columns: 50px 1fr; }
  .slot .acts { grid-column: 2; justify-content: flex-start; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .hide-m { display: none; }
}
.mob-only { display: none !important; }

textarea.input { min-height: 110px; resize: vertical; line-height: 1.45; }
.slot.keldi { background: linear-gradient(90deg, var(--ok-soft), transparent 45%); }
.slot.noshow { background: linear-gradient(90deg, var(--danger-soft), transparent 45%); }
.slot.busy .nm { color: var(--muted); font-weight: 600; }
.ib.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.bubble { background: var(--card2); border-radius: 16px 16px 16px 4px; padding: 12px 14px; white-space: pre-wrap; font-weight: 500; max-width: 420px; border: 1px solid var(--line); }
.bubble .bbtn { margin-top: 10px; text-align: center; padding: 8px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-deep); font-weight: 700; font-size: 13px; }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 13.5px; margin-bottom: 14px; }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
</style>
</head>

/* ======================================================== состояние и утилиты */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
const S = { lang: store.get('bc_lang') || ((navigator.language || '').startsWith('ru') ? 'ru' : 'uz'), token: store.get('bc_token'), admin: null,
  today: '', page: 'schedule', day: '', dayData: null, overview: null, statsRange: 'month', branchOrder: [], settings: null, kanal: [] };
const t = k => k.split('.').reduce((o, x) => o && o[x], L[S.lang]) ?? k;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const addDays = (day, n) => { const d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const wd = day => new Date(day + 'T12:00:00Z').getUTCDay();
const fmtDay = day => { const d = new Date(day + 'T12:00:00Z'); return L[S.lang].fmt(d.getUTCDate(), t('months')[d.getUTCMonth()], t('daysFull')[d.getUTCDay()]); };
const dm = day => day.slice(8, 10) + '.' + day.slice(5, 7);
const fmtPhone = p => { p = String(p || '').replace(/\D/g, '').slice(-9); return p.length === 9 ? `+998 ${p.slice(0, 2)} ${p.slice(2, 5)} ${p.slice(5, 7)} ${p.slice(7)}` : p; };

function toast(msg, err) {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast' + (err ? ' err' : ''); }, 3200);
}
const errMsg = e => L[S.lang].errors[e.message] || (L[S.lang].errors.error + ': ' + (e.detail || e.message));

async function api(action, data = {}) {
  if (!API_URL) throw new Error('not_configured');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ admin: true, token: S.token, action, ...data }) });
  } catch (e) { throw new Error('network'); }
  const txt = await r.text();
  let j;
  try { j = JSON.parse(txt); } catch (e) { const er = new Error('error'); er.detail = txt.slice(0, 120); throw er; }
  if (!j.ok) {
    if (j.error === 'auth' && action !== 'login') logout(true);
    const er = new Error(j.error || 'error'); er.detail = j.detail; throw er;
  }
  return j;
}

/* ======================================================== модальные окна */
function modal(html, onMount) {
  closeModal();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  onMount && onMount(o);
  const f = o.querySelector('input:not([type=checkbox]),select'); f && f.focus();
}
function closeModal() { const o = $('#overlay'); o && o.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function langSeg() {
  return `<div class="seg">${['uz', 'ru'].map(l => `<button type="button" data-lang="${l}" class="${S.lang === l ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b) return;
  S.lang = b.dataset.lang; store.set('bc_lang', S.lang);
  S.admin ? renderShell() : renderLogin();
});
function renderLogin(err) {
  $('#root').innerHTML = `<div class="login"><form class="login-card" id="lf">
      <div class="logo"></div><h1>Breket Center</h1><p>${t('title')}</p>
      <div class="stack">
        <label class="f"><span>${t('login')}</span><input class="input" name="login" autocomplete="username" required></label>
        <label class="f"><span>${t('password')}</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
        ${err ? `<div class="badge no" style="display:block;padding:9px 12px;border-radius:10px;white-space:normal">${esc(err)}</div>` : ''}
        <button class="btn primary" style="width:100%;min-height:46px">${t('signIn')}</button>
        <div style="text-align:center">${langSeg()}</div>
      </div></form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    e.target.querySelector('button.primary').disabled = true;
    try {
      const r = await api('login', { login: fd.get('login'), password: fd.get('password') });
      S.token = r.token; store.set('bc_token', r.token);
      await boot();
    } catch (er) { renderLogin(errMsg(er)); }
  };
}
function logout(silent) {
  if (!silent && S.token) api('logout').catch(() => {});
  S.token = null; store.set('bc_token', null); S.admin = null;
  closeModal(); renderLogin();
}

/* ======================================================== расписание */
async function pageSchedule() {
  S.day = S.day || S.today;
  $('#main').innerHTML = head(t('nav.schedule'), `
    <div class="datebar">
      <button class="btn sm" id="prevD">${IC.left}</button>
      <input class="input" type="date" id="dayIn" value="${S.day}">
      <button class="btn sm" id="nextD">${IC.right}</button>
      <button class="btn sm" id="todayD">${t('today')}</button>
      <button class="btn primary" id="addB">${IC.plus} ${t('add')}</button>
    </div>`) + `<div class="strip" id="strip"></div><div id="dayBox"><div class="spin"></div></div>`;
  $('#prevD').onclick = () => setDay(addDays(S.day, -1));
  $('#nextD').onclick = () => setDay(addDays(S.day, 1));
  $('#todayD').onclick = () => setDay(S.today);
  $('#dayIn').onchange = e => e.target.value && setDay(e.target.value);
  $('#addB').onclick = () => bookingModal({ day: S.day, branch: firstBranch() });
  await Promise.all([loadStrip(), loadDay()]);
}
function firstBranch() {
  const d = S.dayData;
  if (d) for (const b of S.branchOrder) if (d.branches[b].rows.length) return b;
  return S.branchOrder[0];
}
async function setDay(day) {
  S.day = day;
  if ($('#dayIn')) $('#dayIn').value = day;
  const inStrip = S.overview && S.overview.some(x => x.day === day);
  await Promise.all([inStrip ? Promise.resolve(drawStrip()) : loadStrip(), loadDay()]);
}
async function loadStrip() {
  try { S.overview = (await api('overview', { from: addDays(S.day, -3), days: 21 })).days; drawStrip(); } catch (e) { toast(errMsg(e), true); }
}
function drawStrip() {
  const el = $('#strip'); if (!el) return;
  el.innerHTML = S.overview.map(x => {
    const br = Object.values(x.branches), booked = br.reduce((a, b) => a + b.booked, 0), total = br.reduce((a, b) => a + b.booked + b.free, 0);
    return `<button class="day ${x.day === S.day ? 'on' : ''} ${x.day === S.today ? 'today' : ''} ${br.length ? '' : 'off'}" data-day="${x.day}">
      <div class="w">${t('days')[wd(x.day)]}</div><div class="d">${+x.day.slice(8)}</div><div class="c">${br.length ? booked + '/' + total : ''}</div></button>`;
  }).join('');
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => setDay(b.dataset.day));
  const on = el.querySelector('.on'); on && on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
async function loadDay() {
  const box = $('#dayBox'); if (!box) return;
  try { S.dayData = await api('day', { day: S.day }); drawDay(); } catch (e) { box.innerHTML = `<div class="card empty">${esc(errMsg(e))}</div>`; }
}
async function reloadDay() { await Promise.all([loadDay(), loadStrip()]); }

function drawDay() {
  const d = S.dayData, box = $('#dayBox');
  if (!box || d.day !== S.day) return;
  if (!d.sheet) { box.innerHTML = `<div class="card closed">${fmtDay(d.day)} — ${t('noSheet')}</div>`; return; }
  const shown = S.branchOrder.filter(b => d.branches[b].rows.length);
  if (!shown.length) { box.innerHTML = `<div class="card closed">${fmtDay(d.day)} — ${t('noAct')}</div>`; return; }
  box.innerHTML = `<div class="cols">${shown.map(b => branchCard(b, d.branches[b].rows)).join('')}</div>`;
  bindDay();
}

function rowHtml(b, r) {
  const past = S.day < S.today;
  if (!r.name) {
    if (r.busyBy) return `<div class="slot busy"><div class="tm">${r.time}</div><div><div class="nm">${t('busy')}: ${esc(r.busyBy.join(', '))}</div></div><div></div></div>`;
    return `<div class="slot free"><div class="tm">${r.time}</div><div class="nm">${t('free')}</div>
      <div class="acts">${past ? '' : `<button class="btn sm" data-a="add" data-branch="${esc(b)}" data-time="${r.time}">${IC.plus} ${t('add')}</button>`}</div></div>`;
  }
  const no = /кемиди|келмади|kelmadi|не приш/i.test(r.status || '');
  const cls = r.keldi ? 'keldi' : (no ? 'noshow' : '');
  const meta = [
    r.bot ? `<span class="badge bot">${t('bot')}</span>` : '',
    r.bot && r.bot.confirmed ? `<span class="badge ok">✓ ${t('kelaman')}</span>` : '',
    r.keldi ? `<span class="badge ok">${t('keldi')}</span>` : '',
    r.channel ? `<span class="badge">${esc(r.channel)}</span>` : '',
    r.status ? `<span class="badge ${no ? 'no' : ''}">${esc(r.status)}</span>` : ''
  ].join('');
  return `<div class="slot ${cls}">
    <div class="tm">${r.time}</div>
    <div><div class="nm">${esc(r.name)}</div>${r.phone ? `<div class="ph"><a href="tel:+998${esc(r.phone)}">${fmtPhone(r.phone)}</a></div>` : ''}
      <div class="meta">${meta}</div>${r.izoh ? `<div class="note">${esc(r.izoh)}</div>` : ''}</div>
    <div class="acts">
      <button class="ib ${r.keldi ? 'on' : 'ok'}" title="${t('markCame')}" data-a="keldi" data-row="${r.row}">${IC.check}</button>
      <button class="ib" title="${t('edit')}" data-a="edit" data-row="${r.row}">${IC.edit}</button>
      ${past ? '' : `<button class="ib" title="${t('move')}" data-a="move" data-row="${r.row}">${IC.move}</button>`}
      <button class="ib no" title="${t('cancel')}" data-a="cancel" data-row="${r.row}">${IC.x}</button>
    </div></div>`;
}
function branchCard(b, rows) {
  const booked = rows.filter(r => r.name).length, free = rows.filter(r => !r.name && !r.busyBy).length;
  return `<section class="card">
    <div class="bcard-h"><b>${esc(b)}</b><span class="badge">${booked} ${t('booked')}</span><span class="badge bot">${free} ${t('freeN')}</span></div>
    ${rows.map(r => rowHtml(b, r)).join('')}</section>`;
}
function findRow(row) {
  for (const b of S.branchOrder) { const r = S.dayData.branches[b].rows.find(x => x.row === +row); if (r) return { ...r, branch: b }; }
  return null;
}
function bindDay() {
  $('#dayBox').querySelectorAll('[data-a]').forEach(el => el.onclick = async () => {
    const a = el.dataset.a, r = el.dataset.row ? findRow(el.dataset.row) : null;
    try {
      if (a === 'add') return bookingModal({ day: S.day, branch: el.dataset.branch, time: el.dataset.time });
      if (a === 'edit') return editModal(r);
      if (a === 'move') return moveModal(r);
      if (a === 'keldi') { el.disabled = true; await api('setKeldi', { row: r.row, day: S.day, value: !r.keldi }); toast(r.keldi ? t('done') : t('keldi')); }
      if (a === 'cancel') {
        if (!confirm(t('askCancel') + '\n\n' + r.name + ' · ' + r.time)) return;
        await api('cancelBooking', { row: r.row, day: S.day, name: r.name, notify: true });
        toast(t('done'));
      }
      await reloadDay();
    } catch (e) { toast(errMsg(e), true); if (e.message === 'row_changed') reloadDay(); }
  });
}

function timesSelect(sel, branch, day, keep) {
  sel.innerHTML = '<option>…</option>';
  return api('freeTimes', { branch, day }).then(r => {
    const times = r.times.slice();
    if (keep && !times.includes(keep)) times.unshift(keep);
    sel.innerHTML = times.length ? times.map(x => `<option ${x === keep ? 'selected' : ''}>${x}</option>`).join('') : `<option value="">${t('noFree')}</option>`;
  }).catch(e => { sel.innerHTML = `<option value="">${esc(errMsg(e))}</option>`; });
}
const kanalOptions = cur => `<option value="">—</option>` + S.kanal.map(k => `<option ${k === cur ? 'selected' : ''}>${esc(k)}</option>`).join('')
  + (cur && !S.kanal.includes(cur) ? `<option selected>${esc(cur)}</option>` : '');

function bookingModal(bk) {
  modal(`<h2>${t('newBooking')}</h2>
    <form id="bf" class="stack">
      <label class="f"><span>${t('name')}</span><input class="input" name="name" required minlength="2" maxlength="60"></label>
      <label class="f"><span>${t('phone')}</span><input class="input" name="phone" required inputmode="tel" placeholder="90 123 45 67"></label>
      <div class="grid2">
        <label class="f"><span>${t('branch')}</span><select class="input" name="branch">${S.branchOrder.map(b => `<option ${b === bk.branch ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>
        <label class="f"><span>${t('date')}</span><input class="input" type="date" name="day" required value="${bk.day}"></label>
      </div>
      <div class="grid2">
        <label class="f"><span>${t('time')}</span><select class="input" name="time"></select></label>
        ${S.kanal.length ? `<label class="f"><span>${t('kanal')}</span><select class="input" name="channel">${kanalOptions('')}</select></label>` : ''}
      </div>
      <label class="f"><span>${t('izoh')}</span><input class="input" name="izoh" maxlength="300"></label>
      <div class="row"><button type="button" class="btn" onclick="closeModal()">${t('close')}</button><button class="btn primary">${t('save')}</button></div>
    </form>`, o => {
    const f = o.querySelector('#bf');
    const load = () => timesSelect(f.time, f.branch.value, f.day.value, bk.time);
    f.branch.onchange = load; f.day.onchange = load; load();

      e.preventDefault();
      if (!f.time.value) return toast(t('noFree'), true);
      const btn = f.querySelector('.btn.primary'); btn.disabled = true;
      try {
        const r = await api('addBooking', { name: f.name.value, phone: f.phone.value, branch: f.branch.value, day: f.day.value, time: f.time.value,
          izoh: f.izoh.value, channel: f.channel ? f.channel.value : '' });
        closeModal(); toast(r.linked ? t('linked') : t('saved'));
        S.day = f.day.value; if ($('#dayIn')) $('#dayIn').value = S.day;
        await reloadDay();
      } catch (er) { btn.disabled = false; toast(errMsg(er), true); if (er.message === 'slot_taken') load(); }
    };
  });
}

      <label class="f"><span>${t('izoh')}</span><input class="input" name="izoh" maxlength="300" value="${esc(r.izoh)}"></label>

      e.preventDefault();

function moveModal(r) {
  modal(`<h2>${t('moveBooking')}</h2>

      <div class="grid2">
        <label class="f"><span>${t('branch')}</span><select class="input" name="branch">${S.branchOrder.map(b => `<option ${b === r.branch ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>
        <label class="f"><span>${t('date')}</span><input class="input" type="date" name="day" required value="${S.day}"></label>

        await api('moveBooking', { row: r.row, fromDay: S.day, name: r.name, branch: f.branch.value, day: f.day.value, time: f.time.value,
          notify: f.notify ? f.notify.checked : false });

}

/* ======================================================== рассылка */

    <form class="card pad stack" id="bcf">

      <label class="f"><span>${t('bcWho')}</span><select class="input" name="branch" id="bcWho"><option value="all">${t('bcAll')}</option>${S.branchOrder.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select></label>

      <div id="bcRes"></div>
    </form>
    <div class="card pad"><h3>${t('bcPreview')}</h3><div id="bcPrev"></div></div></div>`;
  let counts = {};
  const f = $('#bcf');
  const upd = () => {
    const txt = (S.lang === 'ru' ? (f.ru.value || f.uz.value) : (f.uz.value || f.ru.value)) || '…';
    $('#bcPrev').innerHTML = `<div class="bubble">${esc(txt)}${f.btn.checked ? `<div class="bbtn">📅 ${S.lang === 'ru' ? 'Записаться' : 'Yozilish'}</div>` : ''}</div>
      <div class="muted" style="margin-top:12px;font-weight:700">${counts[f.branch.value] ?? '…'} ${t('people')}</div>`;
  };
  f.oninput = upd; f.onchange = upd; upd();
  try { counts = (await api('audience')).counts; upd(); } catch (e) { toast(errMsg(e), true); }
  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.uz.value.trim() && !f.ru.value.trim()) return;
    const n = counts[f.branch.value] ?? '?';

    const btn = f.querySelector('.btn.primary'); btn.disabled = true; btn.innerHTML = '<div class="spin" style="width:20px;height:20px;margin:0;border-width:2.5px"></div>';
    try {
      const r = await api('broadcast', { textUz: f.uz.value, textRu: f.ru.value, branch: f.branch.value, withButton: f.btn.checked });
      $('#bcRes').innerHTML = `<div class="badge ok" style="display:block;padding:10px 12px;border-radius:10px">${t('bcDone')(r.sent, r.total)}${r.blocked ? ` · ${t('blocked')}: ${r.blocked}` : ''}</div>`;
      f.uz.value = ''; f.ru.value = ''; upd();
    } catch (er) { toast(errMsg(er), true); }
    btn.disabled = false; btn.innerHTML = `${IC.send} ${t('bcSend')}`;
  };
}

/* ======================================================== статистика */
function statsRange() {
  const td = S.today;
  if (S.statsRange === 'week') return [addDays(td, -6), td];
  if (S.statsRange === 'month') return [addDays(td, -29), td];
  if (S.statsRange === 'thisMonth') return [td.slice(0, 8) + '01', td];
  if (S.statsRange === 'next') return [td, addDays(td, 29)];
  return [S.statsFrom || addDays(td, -6), S.statsTo || td];
}
async function pageStats() {
  const [from, to] = statsRange();
  $('#main').innerHTML = head(t('nav.stats'), `
    <div class="seg">${['week', 'month', 'thisMonth', 'next'].map(k => `<button data-r="${k}" class="${S.statsRange === k ? 'on' : ''}">${t('period.' + k)}</button>`).join('')}</div>
    <div class="datebar"><input class="input" type="date" id="sf" value="${from}"> <input class="input" type="date" id="st" value="${to}"></div>
    <button class="btn" id="csv">${IC.dl} ${t('export')}</button>`) + '<div id="sbox"><div class="spin"></div></div>';
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.statsRange = b.dataset.r; pageStats(); });
  const custom = () => { S.statsRange = 'custom'; S.statsFrom = $('#sf').value; S.statsTo = $('#st').value; pageStats(); };
  $('#sf').onchange = custom; $('#st').onchange = custom;
  $('#csv').onclick = () => exportCsv(from, to);
  try {
    const r = await api('stats', { from, to });
    const rate = r.came ? Math.round(100 * r.came / (r.came + r.noshow + r.unmarked)) + '%' : '—';
    const days = []; for (let d = from; d <= to; d = addDays(d, 1)) days.push(d);
    const max = Math.max(1, ...days.map(d => (r.byDay[d] || {}).total || 0));
    $('#sbox').innerHTML = `
      <div class="kpis">${[['total', r.total], ['came', r.came], ['noshow', r.noshow], ['unmarked', r.unmarked], ['upcoming', r.upcoming], ['rate', rate], ['free', r.free]]
        .map(([k, n]) => `<div class="card kpi"><small>${t('k.' + k)}</small><b>${n}</b></div>`).join('')}</div>
      <div class="grid3" style="margin-bottom:16px">
        <div class="card pad"><h3>${t('botStats')}</h3>${Object.entries(r.bot).filter(([k]) => k !== 'fromBotRows').map(([k, n]) => `<div class="kv"><span>${t('botK.' + k)}</span><b>${n}</b></div>`).join('')}</div>
        <div class="card pad"><h3>${t('byKanal')}</h3>${Object.entries(r.kanal).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="kv"><span>${esc(k)}</span><b>${n}</b></div>`).join('') || '—'}</div>
        <div class="card pad"><h3>${t('byBranch')}</h3>${Object.entries(r.branches).map(([b, x]) => `<div class="kv"><b>${esc(b)}</b><span>${x.total} · <span class="badge ok">${x.came}</span> <span class="badge no">${x.noshow}</span></span></div>`).join('')}</div>
      </div>
      <div class="card"><div class="pad" style="padding-bottom:0"><h3>${t('byDay')}</h3></div>
        <div class="bars">${days.map(d => { const x = r.byDay[d] || { total: 0, came: 0, noshow: 0 }; const p = x.total - x.came - x.noshow;
          return `<div class="bar" style="height:${Math.max(100 * x.total / max, 2)}%" title="${dm(d)}: ${x.total}">${x.total ? `<i class="c" style="height:${100 * x.came / x.total}%"></i><i class="n" style="height:${100 * x.noshow / x.total}%"></i><i class="p" style="height:${100 * p / x.total}%"></i>` : ''}</div>`; }).join('')}</div>
        <div class="bar-l">${days.map((d, i) => `<span>${days.length <= 14 || i % Math.ceil(days.length / 10) === 0 ? +d.slice(8) : ''}</span>`).join('')}</div>
        <div class="legend"><span><i style="background:var(--ok)"></i>${t('k.came')}</span><span><i style="background:var(--danger)"></i>${t('k.noshow')}</span><span><i style="background:var(--brand)"></i>${t('k.upcoming')} / ${t('k.unmarked')}</span></div>
      </div>`;
  } catch (e) { $('#sbox').innerHTML = `<div class="card empty">${esc(errMsg(e))}</div>`; }
}
async function exportCsv(from, to) {
  try {
    const r = await api('rows', { from, to });
    const headRow = [t('date'), t('time'), t('branch'), t('name'), t('phone'), 'Keldi', 'Kanal', 'Status', t('izoh'), 'Operator', 'Gaplashilgan sana', 'Bot'];
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = r.rows.map(b => [dm(b.day) + '.' + b.day.slice(0, 4), b.time, b.branch, b.name, b.phone ? '+998' + b.phone : '', b.keldi ? '✓' : '', b.channel, b.status, b.izoh, b.operator, b.bookedOn, b.bot ? '✓' : '']);
    const csv = '﻿' + [headRow, ...rows].map(x => x.map(q).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `breket_${from}_${to}.csv`; a.click();
  } catch (e) { toast(errMsg(e), true); }
}

      <tbody>${r.users.map(u => `<tr><td><b>${esc(u.name)}</b>${u.blocked ? ` <span class="badge no">${t('blocked')}</span>` : ''}</td><td>${fmtPhone(u.phone)}</td>
        <td class="hide-m">${u.lang.toUpperCase()}</td><td class="hide-m">${esc(u.branch) || '—'}</td>

      <div class="muted" style="padding:10px 14px;font-weight:700">${t('total')}: ${r.total}</div>`
      : '<div class="empty">—</div>';
  } catch (e) { toast(errMsg(e), true); }
}

/* ======================================================== настройки */
function pageSettings() {
  const s = S.settings;
  const kanalSel = `<select class="input" name="channel"><option value="" ${!s.channel ? 'selected' : ''}>${t('empty')}</option>
    ${S.kanal.map(k => `<option ${k === s.channel ? 'selected' : ''}>${esc(k)}</option>`).join('')}
    ${s.channel && !S.kanal.includes(s.channel) ? `<option selected>${esc(s.channel)}</option>` : ''}</select>`;
  $('#main').innerHTML = head(t('nav.settings')) + `<form id="sform">
    <h3 style="margin:0 0 12px">${t('addresses')}</h3>
    ${S.branchOrder.map(b => { const x = s.branches[b] || {}; return `<div class="card pad sect" data-branch="${esc(b)}"><h3>${esc(b)}</h3>
      <div class="grid2">
        <label class="f"><span>${t('addrUz')}</span><input class="input" name="address_uz" value="${esc(x.address_uz)}"></label>
        <label class="f"><span>${t('addrRu')}</span><input class="input" name="address_ru" value="${esc(x.address_ru)}"></label>
        <label class="f"><span>${t('lmUz')}</span><input class="input" name="landmark_uz" value="${esc(x.landmark_uz)}"></label>
        <label class="f"><span>${t('lmRu')}</span><input class="input" name="landmark_ru" value="${esc(x.landmark_ru)}"></label>
      </div>
      <label class="f" style="margin-top:12px"><span>${t('map')}</span><input class="input" name="map" value="${esc(x.map)}" placeholder="https://maps.app.goo.gl/..."></label>
    </div>`; }).join('')}
    <div class="card pad sect"><h3>${t('general')}</h3><div class="grid2">
      <label class="f"><span>${t('adminUser')}</span><input class="input" name="adminUsername" value="${esc(s.adminUsername)}" placeholder="breket_admin"></label>
      <label class="f"><span>${t('botKanal')}</span>${kanalSel}</label></div></div>
    <div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn primary" style="min-height:44px;padding:0 26px">${t('save')}</button></div>
  </form>`;
  $('#sform').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, out = { branches: {} };
    f.querySelectorAll('[data-branch]').forEach(card => {
      const g = n => card.querySelector(`[name="${n}"]`).value;
      out.branches[card.dataset.branch] = { address_uz: g('address_uz'), address_ru: g('address_ru'), landmark_uz: g('landmark_uz'), landmark_ru: g('landmark_ru'), map: g('map') };
    });
    out.adminUsername = f.adminUsername.value; out.channel = f.channel.value;
    try { S.settings = (await api('saveSettings', { settings: out })).settings; toast(t('saved')); pageSettings(); }
    catch (er) { toast(errMsg(er), true); }
  };
}

/* ======================================================== админы */
async function pageAdmins() {
  const owner = S.admin.role === 'owner';
  $('#main').innerHTML = head(t('nav.admins')) + `<div class="grid2" style="align-items:start">
    <div class="card"><div id="alist"><div class="spin"></div></div></div>
    <div>
      ${owner ? `<form class="card pad sect" id="addA"><h3>${t('addAdmin')}</h3><div class="stack">
        <label class="f"><span>${t('name')}</span><input class="input" name="name" required></label>
        <div class="grid2"><label class="f"><span>${t('login')}</span><input class="input" name="login" required pattern="[a-zA-Z0-9_.]{3,32}" autocomplete="off"></label>
        <label class="f"><span>${t('password')}</span><input class="input" name="password" required minlength="6" autocomplete="new-password"></label></div>
        <label class="f"><span>${t('role')}</span><select class="input" name="role"><option value="admin">${t('adminRole')}</option><option value="owner">${t('owner')}</option></select></label>
        <button class="btn primary">${IC.plus} ${t('addAdmin')}</button></div></form>` : ''}
      <form class="card pad sect" id="pwF"><h3>${t('myPassword')}</h3><div class="stack">
        <label class="f"><span>${t('oldPw')}</span><input class="input" type="password" name="old" required autocomplete="current-password"></label>
        <label class="f"><span>${t('newPw')}</span><input class="input" type="password" name="pw" required minlength="6" autocomplete="new-password"></label>
        <button class="btn primary">${t('save')}</button></div></form>
    </div></div>
    <h3 style="margin:24px 0 12px">${t('log')}</h3><div class="card" id="logBox"><div class="spin"></div></div>`;
  const load = async () => {
    const r = await api('admins');
    $('#alist').innerHTML = `<table class="table"><thead><tr><th>${t('name')}</th><th>${t('login')}</th><th>${t('role')}</th><th></th></tr></thead><tbody>
      ${r.admins.map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.login)}</td><td><span class="badge ${a.role === 'owner' ? 'bot' : ''}">${a.role === 'owner' ? t('owner') : t('adminRole')}</span></td>
        <td style="text-align:right">${owner && a.login !== S.admin.login ? `<button class="ib no" title="${t('remove')}" data-rm="${esc(a.login)}">${IC.trash}</button>` : ''}</td></tr>`).join('')}</tbody></table>`;
    $('#alist').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      if (!confirm(t('remove') + ': ' + b.dataset.rm + '?')) return;
      try { await api('removeAdmin', { login: b.dataset.rm }); toast(t('done')); load(); } catch (e) { toast(errMsg(e), true); }
    });
    $('#logBox').innerHTML = r.log.length ? `<div class="scroll-x"><table class="table"><tbody>${r.log.map(x =>
      `<tr><td class="muted" style="white-space:nowrap">${esc(x.ts)}</td><td><b>${esc(x.who)}</b></td><td>${esc(x.text)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">—</div>';
  };
  try { await load(); } catch (e) { toast(errMsg(e), true); }
  if (owner) $('#addA').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { await api('addAdmin', { name: f.name.value, login: f.login.value, password: f.password.value, role: f.role.value }); f.reset(); toast(t('done')); load(); }
    catch (er) { toast(errMsg(er), true); }
  };
  $('#pwF').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { await api('changePassword', { oldPassword: f.old.value, password: f.pw.value }); f.reset(); toast(t('saved')); }
    catch (er) { toast(errMsg(er), true); }
  };
}

/* ======================================================== старт */
async function boot() {
  if (!S.token) return renderLogin(API_URL ? '' : L[S.lang].errors.not_configured);
  try {
    const r = await api('me');
    S.admin = r.admin; S.today = r.today; S.branchOrder = r.branchOrder; S.settings = r.settings; S.kanal = r.kanal || [];
    const h = location.hash.slice(1);
    if (PAGES.includes(h)) S.page = h;
    renderShell();
  } catch (e) { if (e.message !== 'auth') renderLogin(errMsg(e)); }
}
boot();
